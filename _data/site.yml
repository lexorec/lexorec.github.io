bio: >-
  <p><strong>Psicólogo Clínico</strong>, Facultad de Filosofía, Letras y Ciencias de la Educación de la <a href="https://www.ucsg.edu.ec/">Universidad Católica de Santiago de Guayaquil (UCSG)</a>. <strong>Abogado de los Tribunales y Juzgados de la República del Ecuador</strong>, Facultad de Jurisprudencia y Ciencias Sociales y Políticas de la <a href="http://www.ug.edu.ec/">Universidad de Guayaquil (UG)</a>. <strong>Master en Derecho Constitucional y Administrativo</strong>, Facultad de Derecho de la <a href="http://www.uh.cu/">Universidad de la Habana (UH)</a>.</p>
  <p>En el ejercicio profesional, se desenvuelve como abogado litigante dedicado al área del Derecho individual y colectivo del Trabajo, asuntos administrativos y contenciosos-administrativos, acciones constitucionales, contravenciones penales y de tránsito, asuntos de Derecho Civil, Niñez y Adolescencia. En el ámbito académico, fue docente de los cursos de nivelación universitaria del Sistema Nacional de Nivelación Académica (SNNA) en Guayaquil - Ecuador (2015-2016) y fue docente en la Universidad Metropolitana - sede Machala (2022).</p>
  <p>Los intereses de investigación se centran en el área de derechos y garantías constitucionales, defensa de la Constitución, derechos individuales y colectivos del Trabajo, Administración Pública y Derecho Procesal Constitucional y Laboral.</p>

